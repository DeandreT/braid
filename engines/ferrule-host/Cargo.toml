[package]
name = "weft-ferrule-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ferrule-mapping = { package = "mapping", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
ferrule-engine = { package = "engine", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
ferrule-ir = { package = "ir", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
ferrule-cli = { package = "cli", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
ferrule-codegen = { package = "codegen", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
ferrule-codegen-csharp = { package = "codegen-csharp", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
ferrule-mfd = { package = "mfd", git = "https://github.com/DeandreT/ferrule", rev = "576012aa17c403d9c3fcb8659ed4d3a47ba06864" }
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
# Service-child self-hardening only; the container worker does not select it.
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["process", "thread"] }
seccompiler = "=0.5.0"

[[test]]
name = "sandbox_qualification"
harness = false

[profile.release]
overflow-checks = true

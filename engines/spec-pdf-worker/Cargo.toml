[package]
name = "braid-spec-pdf-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ferrule-pdf = { package = "format-pdf", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-mapping = { package = "mapping", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-ir = { package = "ir", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
lopdf = { version = "=0.42.0", default-features = false }
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["process", "thread"] }
seccompiler = "=0.5.0"

# Local stack in the hosted shape: PostgreSQL, a separate migration step with the migrator
# credential, private storage and session key-ring volumes, and the Session-profile server
# behind its same-replica edge.
# Values come from the caller's private environment; see docs/runtime-packaging.md.
name: braid-hosted-shape

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /run/braid/secrets:uid=1654,gid=1654,mode=0700,size=1m

services:
  postgres:
    image: docker.io/library/postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
    platform: linux/amd64
    environment:
      POSTGRES_DB: braid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BRAID_LOCAL_POSTGRES_ADMIN_PASSWORD:?Set a local database admin password}
      BRAID_LOCAL_MIGRATOR_PASSWORD: ${BRAID_LOCAL_MIGRATOR_PASSWORD:?}
      BRAID_LOCAL_RUNTIME_PASSWORD: ${BRAID_LOCAL_RUNTIME_PASSWORD:?}
      BRAID_LOCAL_INGEST_PASSWORD: ${BRAID_LOCAL_INGEST_PASSWORD:?}
      BRAID_LOCAL_CATALOG_PASSWORD: ${BRAID_LOCAL_CATALOG_PASSWORD:?}
      BRAID_LOCAL_METADATA_PASSWORD: ${BRAID_LOCAL_METADATA_PASSWORD:?}
      BRAID_LOCAL_CREATOR_PASSWORD: ${BRAID_LOCAL_CREATOR_PASSWORD:?}
      BRAID_LOCAL_REPORT_PASSWORD: ${BRAID_LOCAL_REPORT_PASSWORD:?}
      BRAID_LOCAL_DERIVATION_PASSWORD: ${BRAID_LOCAL_DERIVATION_PASSWORD:?}
      BRAID_LOCAL_MAINTENANCE_PASSWORD: ${BRAID_LOCAL_MAINTENANCE_PASSWORD:?}
      BRAID_LOCAL_IDENTITY_PASSWORD: ${BRAID_LOCAL_IDENTITY_PASSWORD:?}
      BRAID_LOCAL_PAYLOAD_PERMISSION_PASSWORD: ${BRAID_LOCAL_PAYLOAD_PERMISSION_PASSWORD:?}
      BRAID_LOCAL_SESSION_READER_PASSWORD: ${BRAID_LOCAL_SESSION_READER_PASSWORD:?}
      BRAID_LOCAL_SESSION_WRITER_PASSWORD: ${BRAID_LOCAL_SESSION_WRITER_PASSWORD:?}
      BRAID_LOCAL_CHAT_READER_PASSWORD: ${BRAID_LOCAL_CHAT_READER_PASSWORD:?}
      BRAID_LOCAL_CHAT_WRITER_PASSWORD: ${BRAID_LOCAL_CHAT_WRITER_PASSWORD:?}
      BRAID_LOCAL_CHAT_APPROVER_PASSWORD: ${BRAID_LOCAL_CHAT_APPROVER_PASSWORD:?}
      BRAID_LOCAL_SPEC_READER_PASSWORD: ${BRAID_LOCAL_SPEC_READER_PASSWORD:-}
      BRAID_LOCAL_SPEC_WRITER_PASSWORD: ${BRAID_LOCAL_SPEC_WRITER_PASSWORD:-}
      BRAID_LOCAL_SPEC_MAINTENANCE_PASSWORD: ${BRAID_LOCAL_SPEC_MAINTENANCE_PASSWORD:-}
      BRAID_LOCAL_CREATION_READER_PASSWORD: ${BRAID_LOCAL_CREATION_READER_PASSWORD:-}
      BRAID_LOCAL_CREATION_WRITER_PASSWORD: ${BRAID_LOCAL_CREATION_WRITER_PASSWORD:-}
      BRAID_LOCAL_CREATION_APPROVER_PASSWORD: ${BRAID_LOCAL_CREATION_APPROVER_PASSWORD:-}
      BRAID_LOCAL_CHAT_LIFECYCLE_PASSWORD: ${BRAID_LOCAL_CHAT_LIFECYCLE_PASSWORD:?}
      BRAID_LOCAL_PREVIEW_READER_PASSWORD: ${BRAID_LOCAL_PREVIEW_READER_PASSWORD:?}
      BRAID_LOCAL_PREVIEW_WRITER_PASSWORD: ${BRAID_LOCAL_PREVIEW_WRITER_PASSWORD:?}
      BRAID_LOCAL_CASE_READER_PASSWORD: ${BRAID_LOCAL_CASE_READER_PASSWORD:?}
      BRAID_LOCAL_CASE_WRITER_PASSWORD: ${BRAID_LOCAL_CASE_WRITER_PASSWORD:?}
      BRAID_LOCAL_RUN_READER_PASSWORD: ${BRAID_LOCAL_RUN_READER_PASSWORD:?}
      BRAID_LOCAL_BUILD_READER_PASSWORD: ${BRAID_LOCAL_BUILD_READER_PASSWORD:?}
      BRAID_LOCAL_BUILD_WRITER_PASSWORD: ${BRAID_LOCAL_BUILD_WRITER_PASSWORD:?}
      BRAID_LOCAL_BUILD_RUN_READER_PASSWORD: ${BRAID_LOCAL_BUILD_RUN_READER_PASSWORD:?}
      BRAID_LOCAL_BUILD_RUN_WRITER_PASSWORD: ${BRAID_LOCAL_BUILD_RUN_WRITER_PASSWORD:?}
      BRAID_LOCAL_BUILD_DISPATCHER_PASSWORD: ${BRAID_LOCAL_BUILD_DISPATCHER_PASSWORD:?}
      BRAID_LOCAL_BUILD_METADATA_PASSWORD: ${BRAID_LOCAL_BUILD_METADATA_PASSWORD:?}
      BRAID_LOCAL_QUALIFICATION_READER_PASSWORD: ${BRAID_LOCAL_QUALIFICATION_READER_PASSWORD:?}
      BRAID_LOCAL_QUALIFICATION_WRITER_PASSWORD: ${BRAID_LOCAL_QUALIFICATION_WRITER_PASSWORD:?}
      BRAID_LOCAL_RELEASE_READER_PASSWORD: ${BRAID_LOCAL_RELEASE_READER_PASSWORD:?}
      BRAID_LOCAL_RELEASE_WRITER_PASSWORD: ${BRAID_LOCAL_RELEASE_WRITER_PASSWORD:?}
      BRAID_LOCAL_INVOCATION_GRANT_WRITER_PASSWORD: ${BRAID_LOCAL_INVOCATION_GRANT_WRITER_PASSWORD:?}
      BRAID_LOCAL_INVOCATION_WRITER_PASSWORD: ${BRAID_LOCAL_INVOCATION_WRITER_PASSWORD:?}
      BRAID_LOCAL_RUN_WRITER_PASSWORD: ${BRAID_LOCAL_RUN_WRITER_PASSWORD:?}
      BRAID_LOCAL_COMPARISON_PASSWORD: ${BRAID_LOCAL_COMPARISON_PASSWORD:?}
      BRAID_LOCAL_API_AUDIT_WRITER_PASSWORD: ${BRAID_LOCAL_API_AUDIT_WRITER_PASSWORD:?}
      BRAID_LOCAL_DRAFT_READER_PASSWORD: ${BRAID_LOCAL_DRAFT_READER_PASSWORD:?}
      BRAID_LOCAL_DRAFT_WRITER_PASSWORD: ${BRAID_LOCAL_DRAFT_WRITER_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../local/postgres-init.sh:/docker-entrypoint-initdb.d/01-braid-roles.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d braid"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot owner step; the server never receives the migrator credential. The runtime image
  # has no Kerberos library, so connection strings disable GSS encryption explicitly.
  migrate:
    <<: *hardened
    image: ${BRAID_IMAGE:-braid:local}
    command: ["migrate"]
    restart: "no"
    environment:
      BRAID_MIGRATION_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_migrator;Password=${BRAID_LOCAL_MIGRATOR_PASSWORD:?};GSS Encryption Mode=Disable
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }

  storage-init:
    <<: *hardened
    image: ${BRAID_IMAGE:-braid:local}
    command: ["initialize-storage", "/var/lib/braid/storage/root"]
    restart: "no"
    network_mode: none
    volumes:
      - private-storage:/var/lib/braid/storage

  session-keys:
    <<: *hardened
    image: ${BRAID_IMAGE:-braid:local}
    command: ["bootstrap-session-keys"]
    restart: "no"
    network_mode: none
    environment:
      BRAID_SESSION_ORGANIZATION_ID: ${BRAID_SESSION_ORGANIZATION_ID:?}
      BRAID_SESSION_APPLICATION_NAME: ${BRAID_SESSION_APPLICATION_NAME:-Braid.Session}
      BRAID_SESSION_KEY_DIRECTORY: /var/lib/braid/keys/ring
      BRAID_DELIVER_SESSION_KEY_PEM: ${BRAID_SESSION_KEY_PEM:?}
    volumes:
      - session-keys:/var/lib/braid/keys

  server:
    <<: *hardened
    image: ${BRAID_IMAGE:-braid:local}
    restart: unless-stopped
    environment:
      BRAID_CATALOG_AUTH_MODE: session
      BRAID_CATALOG_ENABLED: "true"
      BRAID_PUBLIC_ORIGIN: https://${BRAID_PUBLIC_HOST:?}
      BRAID_HOST_TRANSPORT: trustedProxyOneHop
      BRAID_LISTEN_ADDR: 127.0.0.1:8081
      BRAID_KNOWN_PROXY_IP: 127.0.0.1
      BRAID_SESSION_ORGANIZATION_ID: ${BRAID_SESSION_ORGANIZATION_ID:?}
      BRAID_SESSION_APPLICATION_NAME: ${BRAID_SESSION_APPLICATION_NAME:-Braid.Session}
      BRAID_SESSION_KEY_DIRECTORY: /var/lib/braid/keys/ring
      BRAID_ENTRA_TENANT_ID: ${BRAID_ENTRA_TENANT_ID:?}
      BRAID_ENTRA_CLIENT_ID: ${BRAID_ENTRA_CLIENT_ID:?}
      BRAID_DELIVER_SESSION_KEY_PEM: ${BRAID_SESSION_KEY_PEM:?}
      BRAID_DELIVER_ENTRA_CLIENT_PEM: ${BRAID_ENTRA_CLIENT_PEM:?}
      BRAID_DELIVER_SESSION_READER_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_session_reader;Password=${BRAID_LOCAL_SESSION_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_DELIVER_SESSION_WRITER_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_session_writer;Password=${BRAID_LOCAL_SESSION_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_DELIVER_IDENTITY_READER_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_identity_reader;Password=${BRAID_LOCAL_IDENTITY_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_CATALOG_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_catalog_reader;Password=${BRAID_LOCAL_CATALOG_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_METADATA_EDITS_ENABLED: "true"
      BRAID_POSTGRES_METADATA_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_catalog_editor;Password=${BRAID_LOCAL_METADATA_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_PROJECT_CREATION_ENABLED: "true"
      BRAID_POSTGRES_PROJECT_CREATION_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_project_creator;Password=${BRAID_LOCAL_CREATOR_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REVISION_REPORTS_ENABLED: "true"
      BRAID_POSTGRES_REPORT_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_report_reader;Password=${BRAID_LOCAL_REPORT_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_PRIVATE_STORAGE_ROOT: /var/lib/braid/storage/root
    volumes:
      - private-storage:/var/lib/braid/storage
      - session-keys:/var/lib/braid/keys
    # The edge shares this network namespace; only its listener is published.
    ports:
      - 127.0.0.1:${BRAID_COMPOSE_PORT:-8480}:8080
    networks: [database, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      session-keys: { condition: service_completed_successfully }

  edge:
    image: ${BRAID_EDGE_IMAGE:-braid-edge:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    network_mode: service:server
    environment:
      BRAID_PUBLIC_HOST: ${BRAID_PUBLIC_HOST:?}
      BRAID_EDGE_TRUSTED_PROXIES: ${BRAID_EDGE_TRUSTED_PROXIES:-}
    depends_on: [server]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/api/v1/health/ready",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot maintenance run from a separate container against the shared storage volume.
  maintenance:
    <<: *hardened
    image: ${BRAID_IMAGE:-braid:local}
    profiles: [operator]
    restart: "no"
    environment:
      BRAID_MAINTENANCE_CONNECTION_STRING: Host=postgres;Database=braid;Username=braid_maintenance;Password=${BRAID_LOCAL_MAINTENANCE_PASSWORD:?};GSS Encryption Mode=Disable
    entrypoint: ["/app/bin/braid-entrypoint", "maintenance"]
    volumes:
      - private-storage:/var/lib/braid/storage
    networks: [database]

networks:
  database:
    internal: true
  egress: {}

volumes:
  postgres-data:
  private-storage:
  session-keys:

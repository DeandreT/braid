# Bearer access for signed-in users' public API clients beside the browser
# session: Entra v2 delegated tokens for the Session app's exposed scope, from the allowlisted
# client applications, with every mutation audited through its own login delivered as a
# protected private file. See docs/api-authentication.md.
# Use with: docker compose -f compose.yml [-f ...] -f compose.bearer.yml
services:
  server:
    environment:
      BRAID_API_BEARER_ENABLED: "true"
      BRAID_API_BEARER_AUDIENCE: ${BRAID_ENTRA_CLIENT_ID:?}
      BRAID_API_BEARER_SCOPE: ${BRAID_API_BEARER_SCOPE:-braid.api}
      BRAID_API_BEARER_CLIENT_IDS: ${BRAID_API_BEARER_CLIENT_IDS:?Set the allowed public client IDs}
      BRAID_API_AUDIT_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/api-audit-writer
      BRAID_DELIVER_FILE_API_AUDIT_WRITER: Host=postgres;Database=braid;Username=braid_api_audit_writer;Password=${BRAID_LOCAL_API_AUDIT_WRITER_PASSWORD:?};GSS Encryption Mode=Disable

name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: target/ferrule-host
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      WEFT_POSTGRES_IMAGE: docker.io/library/postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
      WEFT_AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm ci --prefix tools/contracts-generator
      - name: Build the pinned edit module
        run: python3 tools/edit-core/build.py --install
      - run: npm run check
      - run: npm run build
      - run: npm run build:browser-session-probe
      - run: node --check tools/browser-session-controlled/owner.mjs
      - name: Install pinned worker toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify the native worker
        run: |
          cargo +1.98.1 fmt --manifest-path engines/ferrule-host/Cargo.toml --check
          cargo +1.98.1 clippy --manifest-path engines/ferrule-host/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.1 test --manifest-path engines/ferrule-host/Cargo.toml --locked
      - name: Verify native and wasm edit equivalence
        run: |
          CARGO_TARGET_DIR=target/edit-qualification cargo +1.98.1 build --manifest-path engines/ferrule-edit-wasm/Cargo.toml --release --target wasm32-unknown-unknown --features qualification --locked
          wasm-bindgen --target web --out-dir artifacts/edit-qualification target/edit-qualification/wasm32-unknown-unknown/release/weft_ferrule_edit_wasm.wasm
          node tools/edit-core/cross-target.mjs artifacts/edit-qualification/weft_ferrule_edit_wasm.js artifacts/edit-qualification/weft_ferrule_edit_wasm_bg.wasm target/ferrule-host/debug/weft-ferrule-host engines/ferrule-host/tests/fixtures
      - name: Verify the compile sandbox launcher
        env:
          CARGO_TARGET_DIR: target/compile-sandbox
        run: |
          cargo +1.98.1 fmt --manifest-path engines/compile-sandbox/Cargo.toml --check
          cargo +1.98.1 clippy --manifest-path engines/compile-sandbox/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.1 test --manifest-path engines/compile-sandbox/Cargo.toml --release --locked
          # The Ferrule service compile tests run this exact launcher around the pinned SDK's compiler.
          printf 'WEFT_COMPILE_SANDBOX_EXECUTABLE=%s\n' "$PWD/target/compile-sandbox/release/weft-compile-sandbox" >> "$GITHUB_ENV"
      - name: Build the restricted worker image
        run: |
          docker build --build-arg "WEFT_REVISION=$GITHUB_SHA" --iidfile "$RUNNER_TEMP/weft-worker-image-id" engines/ferrule-host
          weft_image_id="$(cat "$RUNNER_TEMP/weft-worker-image-id")"
          [[ "$weft_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'WEFT_FERRULE_WORKER_IMAGE=%s\n' "$weft_image_id" >> "$GITHUB_ENV"
          # The Ferrule service tests run this exact worker binary as their sandboxed child.
          weft_native_container="$(docker create "$weft_image_id")"
          docker cp "$weft_native_container:/ferrule-host" "$RUNNER_TEMP/ferrule-host"
          docker rm "$weft_native_container"
          printf 'WEFT_FERRULE_HOST_EXECUTABLE=%s\n' "$RUNNER_TEMP/ferrule-host" >> "$GITHUB_ENV"
      - name: Pull the pinned ownership database and blob emulator
        run: |
          docker pull "$WEFT_POSTGRES_IMAGE"
          docker pull "$WEFT_AZURITE_IMAGE"
      - run: dotnet restore dotnet/Weft.slnx --locked-mode
      - run: dotnet format dotnet/Weft.slnx --verify-no-changes --no-restore
      - run: dotnet build dotnet/Weft.slnx --configuration Release --no-restore
      - name: Verify generated mapping contracts
        run: |
          npm run contracts:check
          git diff --exit-code -- contracts apps/web/src/api/generated.ts
      - name: Publish exact host qualification artifacts
        run: |
          weft_host_qualification="$RUNNER_TEMP/weft-host-qualification"
          test ! -e "$weft_host_qualification"
          dotnet publish dotnet/apps/Weft.Server/Weft.Server.csproj --configuration Release --no-build --no-restore --output "$weft_host_qualification/server"
          dotnet publish dotnet/tools/Weft.HostPrivacyProbe/Weft.HostPrivacyProbe.csproj --configuration Release --no-build --no-restore --output "$weft_host_qualification/probe"
          printf 'WEFT_HOST_TEST_SERVER_PATH=%s\n' "$weft_host_qualification/server/Weft.Server.dll" >> "$GITHUB_ENV"
          printf 'WEFT_HOST_PRIVACY_PROBE_PATH=%s\n' "$weft_host_qualification/probe/Weft.HostPrivacyProbe.dll" >> "$GITHUB_ENV"
      - name: Install isolated browser dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Install the pinned Chrome for Testing build
        run: |
          weft_browser_archive="$RUNNER_TEMP/weft-chromium-157.0.8090.0.zip"
          weft_browser_directory="$RUNNER_TEMP/weft-chromium-157.0.8090.0"
          curl --fail --location --retry 3 --output "$weft_browser_archive" \
            https://storage.googleapis.com/chrome-for-testing-public/157.0.8090.0/linux64/chrome-linux64.zip
          printf '%s  %s\n' 3ec877f440c1ea393c4f164ce5339dc0fd6b5384184a84b38550a78721c2086c "$weft_browser_archive" | sha256sum --check --status
          mkdir "$weft_browser_directory"
          unzip -q "$weft_browser_archive" -d "$weft_browser_directory"
          printf 'WEFT_CHROMIUM_EXECUTABLE=%s\n' "$weft_browser_directory/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: npm run test:auth-https-source
      - name: Verify the isolated browser edit core
        run: env -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR -u XDG_SESSION_TYPE -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a node tools/edit-core/browser-qualification.mjs artifacts/edit-qualification target/ferrule-host/debug/weft-ferrule-host artifacts/edit-browser.json engines/ferrule-host/tests/fixtures
      - name: Prepare owned HTTPS browser admission
        run: node tools/auth-browser-https/admit.mjs --approved
      - run: ulimit -c 0 && dotnet test dotnet/Weft.slnx --configuration Release --no-build --no-restore
        env:
          WEFT_OPENAPI_INCREMENTAL_TESTS: '1'
      - name: Browser verification on a virtual display
        run: npm run test:browser
      - name: Browser verification through the actual CSP shell
        run: WEFT_EDIT_SHELL_DLL="$WEFT_HOST_TEST_SERVER_PATH" WEFT_EDIT_SHELL_ALL=1 env -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR -u XDG_SESSION_TYPE -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a npm --workspace @weft/web run test:e2e -- --config playwright.edit-shell.config.ts

[package]
name = "braid-ferrule-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["core"]

[dependencies]
braid-ferrule-core = { path = "core" }
ferrule-mapping = { package = "mapping", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-engine = { package = "engine", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-ir = { package = "ir", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-cli = { package = "cli", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-codegen = { package = "codegen", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-codegen-csharp = { package = "codegen-csharp", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-format-csv = { package = "format-csv", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-format-xml = { package = "format-xml", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-format-xbrl = { package = "format-xbrl", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-format-protobuf = { package = "format-protobuf", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-format-xlsx = { package = "format-xlsx", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
ferrule-format-flextext = { package = "format-flextext", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
quick-xml = "=0.41.0"
ferrule-mfd = { package = "mfd", git = "https://github.com/DeandreT/ferrule", rev = "796eb8230561f200ca81c153c946a8fe08884e75" }
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
# Service-child self-hardening only; the container worker does not select it.
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["process", "thread"] }
seccompiler = "=0.5.0"

[dev-dependencies]
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[test]]
name = "sandbox_qualification"
harness = false

[profile.release]
overflow-checks = true

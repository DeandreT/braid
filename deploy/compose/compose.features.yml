# Session features beyond catalog, upload and reports: chat, previews, regression cases and runs,
# and builds, each through its own login delivered as a protected private file. The separate
# `runs` Braid.Worker executes previews, regression runs and approved builds through the Ferrule
# service with its own logins, also delivered as private files; like the service override,
# nothing here needs the Docker socket. Builds run through the service's explicitly enabled
# compiler profile with the same toolchain pin as their saved evidence.
# See docs/runtime-packaging.md.
# Use with: docker compose -f compose.yml -f compose.ferrule-service.yml -f compose.features.yml
services:
  server:
    environment:
      BRAID_CHAT_ENABLED: "true"
      BRAID_CHAT_PROFILES_FILE: /run/braid/secrets/chat-profiles
      BRAID_DELIVER_FILE_CHAT_PROFILES: ${BRAID_CHAT_PROFILES_JSON:?Set the private chat profile document}
      BRAID_CHAT_READER_CONNECTION_STRING_FILE: /run/braid/secrets/chat-reader
      BRAID_DELIVER_FILE_CHAT_READER: Host=postgres;Database=braid;Username=braid_chat_reader;Password=${BRAID_LOCAL_CHAT_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_CHAT_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/chat-writer
      BRAID_DELIVER_FILE_CHAT_WRITER: Host=postgres;Database=braid;Username=braid_chat_writer;Password=${BRAID_LOCAL_CHAT_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_CHAT_APPROVER_CONNECTION_STRING_FILE: /run/braid/secrets/chat-approver
      BRAID_DELIVER_FILE_CHAT_APPROVER: Host=postgres;Database=braid;Username=braid_chat_approver;Password=${BRAID_LOCAL_CHAT_APPROVER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_CHAT_PAYLOAD_PERMISSION_CONNECTION_STRING_FILE: /run/braid/secrets/chat-payload-permission
      BRAID_DELIVER_FILE_CHAT_PAYLOAD_PERMISSION: Host=postgres;Database=braid;Username=braid_payload_permission_reader;Password=${BRAID_LOCAL_PAYLOAD_PERMISSION_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_PREVIEWS_ENABLED: "true"
      BRAID_POSTGRES_PREVIEW_READER_CONNECTION_STRING_FILE: /run/braid/secrets/preview-reader
      BRAID_DELIVER_FILE_PREVIEW_READER: Host=postgres;Database=braid;Username=braid_preview_reader;Password=${BRAID_LOCAL_PREVIEW_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_POSTGRES_PREVIEW_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/preview-writer
      BRAID_DELIVER_FILE_PREVIEW_WRITER: Host=postgres;Database=braid;Username=braid_preview_writer;Password=${BRAID_LOCAL_PREVIEW_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSIONS_ENABLED: "true"
      BRAID_REGRESSION_CASE_READER_CONNECTION_STRING_FILE: /run/braid/secrets/case-reader
      BRAID_DELIVER_FILE_CASE_READER: Host=postgres;Database=braid;Username=braid_case_reader;Password=${BRAID_LOCAL_CASE_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_CASE_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/case-writer
      BRAID_DELIVER_FILE_CASE_WRITER: Host=postgres;Database=braid;Username=braid_case_writer;Password=${BRAID_LOCAL_CASE_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_RUN_READER_CONNECTION_STRING_FILE: /run/braid/secrets/run-reader
      BRAID_DELIVER_FILE_RUN_READER: Host=postgres;Database=braid;Username=braid_run_reader;Password=${BRAID_LOCAL_RUN_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_RUN_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/run-writer
      BRAID_DELIVER_FILE_RUN_WRITER: Host=postgres;Database=braid;Username=braid_run_writer;Password=${BRAID_LOCAL_RUN_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILDS_ENABLED: "true"
      BRAID_FERRULE_COMPILE_TOOLCHAIN: ${BRAID_FERRULE_COMPILE_TOOLCHAIN:?Set the verified service toolchain pin}
      BRAID_BUILD_METADATA_CONNECTION_STRING_FILE: /run/braid/secrets/build-metadata
      BRAID_DELIVER_FILE_BUILD_METADATA: Host=postgres;Database=braid;Username=braid_build_metadata_reader;Password=${BRAID_LOCAL_BUILD_METADATA_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_CONTROL_CONNECTION_STRING_FILE: /run/braid/secrets/build-control
      BRAID_DELIVER_FILE_BUILD_CONTROL: Host=postgres;Database=braid;Username=braid_build_writer;Password=${BRAID_LOCAL_BUILD_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_ACCESS_CONNECTION_STRING_FILE: /run/braid/secrets/build-access
      BRAID_DELIVER_FILE_BUILD_ACCESS: Host=postgres;Database=braid;Username=braid_runtime;Password=${BRAID_LOCAL_RUNTIME_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_REPORT_CONNECTION_STRING_FILE: /run/braid/secrets/build-report
      BRAID_DELIVER_FILE_BUILD_REPORT: Host=postgres;Database=braid;Username=braid_report_reader;Password=${BRAID_LOCAL_REPORT_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_CASE_READER_CONNECTION_STRING_FILE: /run/braid/secrets/build-case-reader
      BRAID_DELIVER_FILE_BUILD_CASE_READER: Host=postgres;Database=braid;Username=braid_case_reader;Password=${BRAID_LOCAL_CASE_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_EVIDENCE_READER_CONNECTION_STRING_FILE: /run/braid/secrets/build-evidence
      BRAID_DELIVER_FILE_BUILD_EVIDENCE: Host=postgres;Database=braid;Username=braid_run_reader;Password=${BRAID_LOCAL_RUN_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_RUN_READER_CONNECTION_STRING_FILE: /run/braid/secrets/build-run-reader
      BRAID_DELIVER_FILE_BUILD_RUN_READER: Host=postgres;Database=braid;Username=braid_build_run_reader;Password=${BRAID_LOCAL_BUILD_RUN_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_RUN_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/build-run-writer
      BRAID_DELIVER_FILE_BUILD_RUN_WRITER: Host=postgres;Database=braid;Username=braid_build_run_writer;Password=${BRAID_LOCAL_BUILD_RUN_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_RELEASE_OPERATIONS_ENABLED: "true"
      BRAID_RELEASE_READER_CONNECTION_STRING_FILE: /run/braid/secrets/release-reader
      BRAID_DELIVER_FILE_RELEASE_READER: Host=postgres;Database=braid;Username=braid_release_reader;Password=${BRAID_LOCAL_RELEASE_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_RELEASE_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/release-writer
      BRAID_DELIVER_FILE_RELEASE_WRITER: Host=postgres;Database=braid;Username=braid_release_writer;Password=${BRAID_LOCAL_RELEASE_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_QUALIFICATION_READER_CONNECTION_STRING_FILE: /run/braid/secrets/qualification-reader
      BRAID_DELIVER_FILE_QUALIFICATION_READER: Host=postgres;Database=braid;Username=braid_qualification_reader;Password=${BRAID_LOCAL_QUALIFICATION_READER_PASSWORD:?};GSS Encryption Mode=Disable

  # Previews, the regression runs that execute them and approved builds, through the Ferrule
  # service with this worker's own pinned client certificate. No Docker socket, egress or
  # published port.
  runs:
    image: ${BRAID_WORKER_IMAGE:-braid-worker:local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/braid/secrets:uid=1654,gid=1654,mode=0700,size=1m
    environment:
      BRAID_PREVIEW_WORKER_ENABLED: "true"
      BRAID_PREVIEW_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/preview-writer
      BRAID_DELIVER_FILE_PREVIEW_WRITER: Host=postgres;Database=braid;Username=braid_preview_writer;Password=${BRAID_LOCAL_PREVIEW_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_WORKER_ENABLED: "true"
      BRAID_REGRESSION_RUN_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/run-writer
      BRAID_DELIVER_FILE_RUN_WRITER: Host=postgres;Database=braid;Username=braid_run_writer;Password=${BRAID_LOCAL_RUN_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_CASE_READER_CONNECTION_STRING_FILE: /run/braid/secrets/case-reader
      BRAID_DELIVER_FILE_CASE_READER: Host=postgres;Database=braid;Username=braid_case_reader;Password=${BRAID_LOCAL_CASE_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_ACCESS_CONNECTION_STRING_FILE: /run/braid/secrets/regression-access
      BRAID_DELIVER_FILE_REGRESSION_ACCESS: Host=postgres;Database=braid;Username=braid_runtime;Password=${BRAID_LOCAL_RUNTIME_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_REGRESSION_REPORT_READER_CONNECTION_STRING_FILE: /run/braid/secrets/regression-report
      BRAID_DELIVER_FILE_REGRESSION_REPORT: Host=postgres;Database=braid;Username=braid_report_reader;Password=${BRAID_LOCAL_REPORT_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_AUTOMATION_COMPARISON_CONNECTION_STRING_FILE: /run/braid/secrets/comparison
      BRAID_DELIVER_FILE_COMPARISON: Host=postgres;Database=braid;Username=braid_comparison_settler;Password=${BRAID_LOCAL_COMPARISON_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_WORKER_ENABLED: "true"
      BRAID_BUILD_DISPATCHER_CONNECTION_STRING_FILE: /run/braid/secrets/build-dispatcher
      BRAID_DELIVER_FILE_BUILD_DISPATCHER: Host=postgres;Database=braid;Username=braid_build_dispatcher;Password=${BRAID_LOCAL_BUILD_DISPATCHER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_WRITER_CONNECTION_STRING_FILE: /run/braid/secrets/build-writer
      BRAID_DELIVER_FILE_BUILD_WRITER: Host=postgres;Database=braid;Username=braid_build_writer;Password=${BRAID_LOCAL_BUILD_WRITER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_ACCESS_CONNECTION_STRING_FILE: /run/braid/secrets/build-access
      BRAID_DELIVER_FILE_BUILD_ACCESS: Host=postgres;Database=braid;Username=braid_runtime;Password=${BRAID_LOCAL_RUNTIME_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_REPORT_READER_CONNECTION_STRING_FILE: /run/braid/secrets/build-report
      BRAID_DELIVER_FILE_BUILD_REPORT: Host=postgres;Database=braid;Username=braid_report_reader;Password=${BRAID_LOCAL_REPORT_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_REGRESSION_RUN_READER_CONNECTION_STRING_FILE: /run/braid/secrets/build-evidence
      BRAID_DELIVER_FILE_BUILD_EVIDENCE: Host=postgres;Database=braid;Username=braid_run_reader;Password=${BRAID_LOCAL_RUN_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_BUILD_CASE_READER_CONNECTION_STRING_FILE: /run/braid/secrets/build-case-reader
      BRAID_DELIVER_FILE_BUILD_CASE_READER: Host=postgres;Database=braid;Username=braid_case_reader;Password=${BRAID_LOCAL_CASE_READER_PASSWORD:?};GSS Encryption Mode=Disable
      BRAID_PRIVATE_STORAGE_ROOT: /var/lib/braid/storage/root
      BRAID_FERRULE_RUNNER: service
      BRAID_FERRULE_COMPILE_TOOLCHAIN: ${BRAID_FERRULE_COMPILE_TOOLCHAIN:?Set the verified service toolchain pin}
      BRAID_FERRULE_WORKER_IMAGE: ${BRAID_FERRULE_SERVICE_IDENTITY:?Set the service build identity}
      BRAID_FERRULE_SERVICE_URL: https://ferrule:8443
      BRAID_FERRULE_SERVICE_CERTIFICATE_SHA256: ${BRAID_FERRULE_SERVICE_CERTIFICATE_SHA256:?Set the service certificate pin}
      BRAID_DELIVER_FERRULE_SERVICE_CLIENT_PEM: ${BRAID_RUNS_FERRULE_SERVICE_CLIENT_PEM:?Set the runs worker service client PEM}
    volumes:
      - private-storage:/var/lib/braid/storage
    networks: [database, ferrule]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

  # The service admits the server's and the runs worker's client certificates.
  ferrule:
    environment:
      BRAID_FERRULE_SERVICE_COMPILE_ENABLED: "true"
      BRAID_FERRULE_SERVICE_CONCURRENCY: "1"
      BRAID_FERRULE_SERVICE_CLIENT_CERTIFICATE_SHA256: ${BRAID_FERRULE_SERVICE_CLIENT_CERTIFICATE_SHA256:?},${BRAID_RUNS_FERRULE_SERVICE_CLIENT_CERTIFICATE_SHA256:?Set the runs worker client certificate pin}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3072M

<div class="app-shell" [class.app-workbench]="workbench()">
  <a
    class="skip-link"
    [routerLink]="[]"
    queryParamsHandling="preserve"
    fragment="main-content"
    (click)="skipToContent($event)"
    >Skip to content</a
  >
  <header class="app-header">
    <a class="brand" routerLink="/examples" aria-label="Weft home"
      ><span class="brand-mark" aria-hidden="true">w</span
      ><span class="brand-name"
        >weft<span class="brand-period">.</span></span
      ></a
    >
    <nav class="workspace-nav" aria-label="Workspace">
      <a
        routerLink="/examples"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        aria-label="Examples"
        title="Examples"
        ><span class="rail-icon" aria-hidden="true">◈</span
        ><span class="rail-label">Examples</span></a
      >
      <a
        routerLink="/catalog"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        aria-label="Catalog"
        title="Catalog"
        ><span class="rail-icon" aria-hidden="true">▦</span
        ><span class="rail-label">Catalog</span></a
      >
    </nav>
    <span class="environment-label">{{
      session.state().kind === "development"
        ? "Development workspace"
        : "Workspace"
    }}</span>
  </header>
  @if (
    session.state().kind !== "disabled" &&
    session.state().kind !== "development"
  ) {
    <weft-browser-auth-controls />
  }
  <main id="main-content" tabindex="-1">
    <router-outlet />
  </main>
  <footer>
    <span>Built around your mappings.</span
    ><span>Weft · Early development</span>
  </footer>
</div>

[package]
name = "braid-ferrule-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["core"]

[dependencies]
braid-ferrule-core = { path = "core" }
ferrule-mapping = { package = "mapping", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-engine = { package = "engine", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-ir = { package = "ir", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-cli = { package = "cli", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-codegen = { package = "codegen", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-codegen-csharp = { package = "codegen-csharp", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-format-csv = { package = "format-csv", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
ferrule-format-xml = { package = "format-xml", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
quick-xml = "=0.41.0"
ferrule-mfd = { package = "mfd", git = "https://github.com/DeandreT/ferrule", rev = "238369bf0071ee8ea097d8c54fa5061f433807fb" }
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
# Service-child self-hardening only; the container worker does not select it.
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["process", "thread"] }
seccompiler = "=0.5.0"

[[test]]
name = "sandbox_qualification"
harness = false

[profile.release]
overflow-checks = true

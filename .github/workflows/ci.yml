name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm ci --prefix tools/contracts-generator
      - run: npm run check
      - run: npm run build
      - run: dotnet restore dotnet/Weft.slnx --locked-mode
      - run: dotnet format dotnet/Weft.slnx --verify-no-changes --no-restore
      - run: dotnet build dotnet/Weft.slnx --configuration Release --no-restore
      - name: Verify generated mapping contracts
        run: |
          npm run contracts:check
          git diff --exit-code -- contracts/weft-v1.json apps/web/src/api/generated.ts
      - run: dotnet test dotnet/Weft.slnx --configuration Release --no-build --no-restore
      - name: Install isolated browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser verification on a virtual display
        run: npm run test:browser

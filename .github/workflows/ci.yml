name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualification:
    name: verify (${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, browser]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: target/ferrule-host
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: "false"
      BRAID_POSTGRES_IMAGE: docker.io/library/postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
      BRAID_AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm ci --prefix tools/contracts-generator
      - name: Build the pinned edit module
        run: python3 tools/edit-core/build.py --install
      - run: npm run check
      - run: npm run build
      - run: npm run build:browser-session-probe
      - run: node --check tools/browser-session-controlled/owner.mjs
      - name: Install pinned worker toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify the native worker
        run: |
          cargo +1.98.1 fmt --manifest-path engines/ferrule-host/Cargo.toml --check
          cargo +1.98.1 clippy --manifest-path engines/ferrule-host/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.1 test --manifest-path engines/ferrule-host/Cargo.toml --locked
          # The creation evidence storage test requires the actual portable authoring compiler.
          cargo +1.98.1 build --manifest-path engines/ferrule-host/Cargo.toml --package braid-ferrule-core --example authoring_protocol --example authored_preview_protocol --release --locked
          install -m 0555 "$CARGO_TARGET_DIR/release/examples/authoring_protocol" "$RUNNER_TEMP/braid-authoring-protocol"
          install -m 0555 "$CARGO_TARGET_DIR/release/examples/authored_preview_protocol" "$RUNNER_TEMP/braid-authored-preview-protocol"
          printf 'BRAID_AUTHORING_TEST_EXECUTABLE=%s\n' "$RUNNER_TEMP/braid-authoring-protocol" >> "$GITHUB_ENV"
          printf 'BRAID_AUTHORED_PREVIEW_TEST_EXECUTABLE=%s\n' "$RUNNER_TEMP/braid-authored-preview-protocol" >> "$GITHUB_ENV"
      - name: Verify native and wasm edit equivalence
        run: |
          CARGO_TARGET_DIR=target/edit-qualification cargo +1.98.1 build --manifest-path engines/ferrule-edit-wasm/Cargo.toml --release --target wasm32-unknown-unknown --features qualification --locked
          wasm-bindgen --target web --out-dir artifacts/edit-qualification target/edit-qualification/wasm32-unknown-unknown/release/braid_ferrule_edit_wasm.wasm
          node tools/edit-core/cross-target.mjs artifacts/edit-qualification/braid_ferrule_edit_wasm.js artifacts/edit-qualification/braid_ferrule_edit_wasm_bg.wasm target/ferrule-host/debug/braid-ferrule-host engines/ferrule-host/tests/fixtures
          # The browser edit qualification reuses this native host; later steps use the image build, so free the runner disk.
          install -m 0555 target/ferrule-host/debug/braid-ferrule-host "$RUNNER_TEMP/braid-edit-native-host"
          rm -rf "$CARGO_TARGET_DIR" target/edit-qualification
      - name: Verify the compile sandbox launcher
        env:
          CARGO_TARGET_DIR: target/compile-sandbox
        run: |
          cargo +1.98.1 fmt --manifest-path engines/compile-sandbox/Cargo.toml --check
          cargo +1.98.1 clippy --manifest-path engines/compile-sandbox/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.1 test --manifest-path engines/compile-sandbox/Cargo.toml --release --locked
          # The Ferrule service compile tests run this exact launcher around the pinned SDK's compiler.
          install -m 0555 "$CARGO_TARGET_DIR/release/braid-compile-sandbox" "$RUNNER_TEMP/braid-compile-sandbox"
          printf 'BRAID_COMPILE_SANDBOX_EXECUTABLE=%s\n' "$RUNNER_TEMP/braid-compile-sandbox" >> "$GITHUB_ENV"
          rm -rf "$CARGO_TARGET_DIR"
      - name: Build the native PDF test prerequisite
        env:
          CARGO_TARGET_DIR: target/spec-pdf-worker
        run: |
          cargo +1.98.1 build --manifest-path engines/spec-pdf-worker/Cargo.toml --release --locked
          install -m 0555 "$CARGO_TARGET_DIR/release/braid-spec-pdf-worker" "$RUNNER_TEMP/braid-spec-pdf-worker"
          printf 'BRAID_TEST_PDF_EXECUTABLE=%s\n' "$RUNNER_TEMP/braid-spec-pdf-worker" >> "$GITHUB_ENV"
          rm -rf "$CARGO_TARGET_DIR"
      - name: Build the restricted worker image
        run: |
          docker build --build-arg "BRAID_REVISION=$GITHUB_SHA" --iidfile "$RUNNER_TEMP/braid-worker-image-id" engines/ferrule-host
          braid_image_id="$(cat "$RUNNER_TEMP/braid-worker-image-id")"
          [[ "$braid_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'BRAID_FERRULE_WORKER_IMAGE=%s\n' "$braid_image_id" >> "$GITHUB_ENV"
          # The Ferrule service tests run this exact worker binary as their sandboxed child.
          braid_native_container="$(docker create "$braid_image_id")"
          docker cp "$braid_native_container:/ferrule-host" "$RUNNER_TEMP/ferrule-host"
          docker rm "$braid_native_container"
          printf 'BRAID_FERRULE_HOST_EXECUTABLE=%s\n' "$RUNNER_TEMP/ferrule-host" >> "$GITHUB_ENV"
          # The scratch image keeps only the worker; drop the Rust build stage cache.
          docker builder prune --all --force
      - name: Pull the pinned ownership database and blob emulator
        run: |
          docker pull "$BRAID_POSTGRES_IMAGE"
          docker pull "$BRAID_AZURITE_IMAGE"
      - run: dotnet restore dotnet/Braid.slnx --locked-mode
      - run: dotnet format dotnet/Braid.slnx --verify-no-changes --no-restore
      - run: dotnet build dotnet/Braid.slnx --configuration Release --no-restore
      - name: Verify generated mapping contracts
        run: |
          npm run contracts:check
          git diff --exit-code -- contracts apps/web/src/api/generated.ts
      - name: Publish exact host qualification artifacts
        run: |
          braid_host_qualification="$RUNNER_TEMP/braid-host-qualification"
          test ! -e "$braid_host_qualification"
          dotnet publish dotnet/apps/Braid.Server/Braid.Server.csproj --configuration Release --no-build --no-restore --output "$braid_host_qualification/server"
          dotnet publish dotnet/tools/Braid.HostPrivacyProbe/Braid.HostPrivacyProbe.csproj --configuration Release --no-build --no-restore --output "$braid_host_qualification/probe"
          printf 'BRAID_HOST_TEST_SERVER_PATH=%s\n' "$braid_host_qualification/server/Braid.Server.dll" >> "$GITHUB_ENV"
          printf 'BRAID_HOST_PRIVACY_PROBE_PATH=%s\n' "$braid_host_qualification/probe/Braid.HostPrivacyProbe.dll" >> "$GITHUB_ENV"
      - name: Install isolated browser dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes --no-install-recommends libnss3-tools
      - name: Install the pinned Chrome for Testing build
        run: |
          braid_browser_archive="$RUNNER_TEMP/braid-chromium-157.0.8090.0.zip"
          braid_browser_directory="$RUNNER_TEMP/braid-chromium-157.0.8090.0"
          curl --fail --location --retry 3 --output "$braid_browser_archive" \
            https://storage.googleapis.com/chrome-for-testing-public/157.0.8090.0/linux64/chrome-linux64.zip
          printf '%s  %s\n' 3ec877f440c1ea393c4f164ce5339dc0fd6b5384184a84b38550a78721c2086c "$braid_browser_archive" | sha256sum --check --status
          mkdir "$braid_browser_directory"
          unzip -q "$braid_browser_archive" -d "$braid_browser_directory"
          printf 'BRAID_CHROMIUM_EXECUTABLE=%s\n' "$braid_browser_directory/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: npm run test:auth-https-source
      - name: Verify the isolated browser edit core
        run: env -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR -u XDG_SESSION_TYPE -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a node tools/edit-core/browser-qualification.mjs artifacts/edit-qualification "$RUNNER_TEMP/braid-edit-native-host" artifacts/edit-browser.json engines/ferrule-host/tests/fixtures
      - name: Prepare owned HTTPS browser admission
        run: node tools/auth-browser-https/admit.mjs --approved
      - name: Verify the CI test launcher
        run: npm run check:tooling
      - name: Verify the qualification capture owner
        run: python3 -m unittest discover -s tools/qualification-capture -p 'test_*.py'
      - name: Verify the .NET solution shard
        if: matrix.partition != 'browser'
        run: ulimit -c 0 && python3 tools/ci/run_tests.py --shard-index ${{ matrix.partition }} --shard-count 4
        env:
          BRAID_OPENAPI_INCREMENTAL_TESTS: "1"
      - name: Browser verification on a virtual display
        if: matrix.partition == 'browser'
        run: npm run test:browser
      - name: Browser verification through the actual CSP shell
        if: matrix.partition == 'browser'
        run: BRAID_EDIT_SHELL_DLL="$BRAID_HOST_TEST_SERVER_PATH" BRAID_EDIT_SHELL_ALL=1 env -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR -u XDG_SESSION_TYPE -u DBUS_SESSION_BUS_ADDRESS xvfb-run -a npm --workspace @braid/web run test:e2e -- --config playwright.edit-shell.config.ts

  # Keep the existing required check name and reject a failed or cancelled shard.
  verify:
    if: always()
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every qualification partition
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$QUALIFICATION_RESULT" = success

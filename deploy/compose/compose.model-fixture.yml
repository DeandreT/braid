# Explicit provider emulation for local acceptance, never a production model. It runs like the
# acceptance relays: non-root, read-only, no capabilities, on the internal models network only.
services:
  model:
    image: ${BRAID_ACCEPTANCE_BUN_IMAGE:?Set the pinned Bun image}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    command: [bun, /opt/acceptance/model.mjs]
    environment:
      BRAID_ACCEPTANCE_CHAT_MODEL: ${BRAID_ACCEPTANCE_CHAT_MODEL:-braid-fixture}
    volumes: !override
      - ../../tools/hosted-acceptance/model.mjs:/opt/acceptance/model.mjs:ro
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "fetch('http://127.0.0.1:11434/api/tags').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

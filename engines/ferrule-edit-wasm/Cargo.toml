[package]
name = "weft-ferrule-edit-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
qualification = []

[dependencies]
weft-ferrule-core = { path = "../ferrule-host/core" }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

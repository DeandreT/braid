name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: target/ferrule-host
      WEFT_POSTGRES_IMAGE: docker.io/library/postgres@sha256:ec9f656f17c8b4dfebf49e58cf5c46d493d4846d4ea6d8b85d0637f68ee33bfc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm ci --prefix tools/contracts-generator
      - run: npm run check
      - run: npm run build
      - name: Install pinned worker toolchain
        run: rustup toolchain install nightly-2026-07-21 --profile minimal --component rustfmt --component clippy
      - name: Verify the native worker
        run: |
          cargo +nightly-2026-07-21 fmt --manifest-path engines/ferrule-host/Cargo.toml --check
          cargo +nightly-2026-07-21 clippy --manifest-path engines/ferrule-host/Cargo.toml --all-targets --locked -- -D warnings
          cargo +nightly-2026-07-21 test --manifest-path engines/ferrule-host/Cargo.toml --locked
      - name: Build the restricted worker image
        run: |
          docker build --build-arg "WEFT_REVISION=$GITHUB_SHA" --iidfile "$RUNNER_TEMP/weft-worker-image-id" engines/ferrule-host
          weft_image_id="$(cat "$RUNNER_TEMP/weft-worker-image-id")"
          [[ "$weft_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'WEFT_FERRULE_WORKER_IMAGE=%s\n' "$weft_image_id" >> "$GITHUB_ENV"
      - name: Pull the pinned ownership database
        run: docker pull "$WEFT_POSTGRES_IMAGE"
      - run: dotnet restore dotnet/Weft.slnx --locked-mode
      - run: dotnet format dotnet/Weft.slnx --verify-no-changes --no-restore
      - run: dotnet build dotnet/Weft.slnx --configuration Release --no-restore
      - name: Verify generated mapping contracts
        run: |
          npm run contracts:check
          git diff --exit-code -- contracts/weft-v1.json apps/web/src/api/generated.ts
      - run: dotnet test dotnet/Weft.slnx --configuration Release --no-build --no-restore
      - name: Install isolated browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser verification on a virtual display
        run: npm run test:browser

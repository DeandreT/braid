[package]
name = "weft-compile-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The same pinned versions as the Ferrule worker's own service sandbox.
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["process", "thread"] }
seccompiler = "=0.5.0"

[[test]]
name = "sandbox_qualification"
harness = false

[profile.release]
overflow-checks = true
